services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hiretrack
      POSTGRES_PASSWORD: hiretrack
      POSTGRES_DB: hiretrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://hiretrack:hiretrack@db:5432/hiretrack
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"

volumes:
  pgdata:
